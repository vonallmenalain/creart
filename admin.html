<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Master Admin-Tool | Audit Log</title>
    <link rel="stylesheet" href="css/styles.css">
    <style>
        /* Nur Regeln für das Änderungsprotokoll; Grundlagen in css/styles.css */
        .admin-controls { display: flex; flex-direction: column; gap: 15px; }
        .filter-row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
        .filter-label { font-weight: 600; font-size: var(--fs-sm); min-width: 110px; color: var(--secondary); }
        .filter-btn { min-height: 34px; padding: 0 14px; border-radius: var(--radius-pill); border: 1px solid var(--border); cursor: pointer; font-size: var(--fs-sm); font-weight: 600; background: #fff; color: var(--secondary); }
        .filter-btn:hover { border-color: var(--primary); }
        .filter-btn.active { background: var(--primary); color: #fff; border-color: var(--primary); }
        .date-input { min-height: 34px !important; padding: 4px 8px !important; }

        th { font-size: var(--fs-xs); text-transform: uppercase; letter-spacing: 0.3px; }
        td { vertical-align: middle; }
        .main-row { cursor: pointer; }
        .main-row:hover td { background-color: var(--surface-muted); }

        /* Aufklappbarer Detail-Bereich */
        .details-row { display: none; background: var(--surface-muted); }
        .details-row.open { display: table-row; }
        .details-row td { white-space: normal; }
        .details-container { padding: 20px; }
        .details-ids { margin-bottom: 15px; color: var(--text-muted); font-family: monospace; font-size: var(--fs-sm); }
        .diff-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        .data-box { background: #fff; border: 1px solid #e2e8f0; border-radius: var(--radius); padding: 15px; border-top-width: 3px; }
        .data-box h4 { margin: 0 0 12px 0; color: var(--text-muted); font-size: var(--fs-sm); text-transform: uppercase; border-bottom: 1px solid var(--line); padding-bottom: 8px; }
        .data-table { width: 100%; border-collapse: collapse; font-size: var(--fs-sm); }
        .data-table td { padding: 6px 8px; border-bottom: 1px solid var(--line); white-space: normal; }
        .data-table td:first-child { font-weight: 600; color: var(--secondary); width: 40%; text-transform: capitalize; }
        .toggle-icon { display: inline-block; transition: transform 0.2s; color: var(--text-muted); font-size: 0.9em; margin-left: 10px; }
        .main-row.open .toggle-icon { transform: rotate(180deg); }
        .zeilen-aktionen { display: inline-flex; align-items: center; justify-content: flex-end; }

        .badge { padding: 3px 10px; border-radius: var(--radius-sm); font-size: var(--fs-xs); font-weight: 600; }
        .col-buchungen { background: #e3f2fd; color: #0d47a1; }
        .col-debitoren { background: #f3e5f5; color: #6a1b9a; }
        .col-adressen { background: #e8f5e9; color: #1b5e20; }
        .col-fw { background: #fff8e1; color: #8a4b00; }
        .col-events { background: #fbe9e7; color: #a63a12; }
        .col-eb { background: #eceff1; color: #37474f; }
        .act-create { background: #d4edda; color: #155724; }
        .act-update { background: #fff3cd; color: #6d4c00; }
        .act-delete { background: #f8d7da; color: #721c24; }

        @media (max-width: 768px) {
            .filter-row { flex-direction: column; align-items: stretch; gap: 8px; }
            .filter-row .filter-btn { width: 100%; }
            .diff-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

    <header class="app-header">
        <h1 class="app-title">Änderungsprotokoll</h1>
        <div class="app-header-actions">
            <nav class="app-nav" aria-label="Bereiche">
                <a href="eingabe.html" class="app-nav-link">Buchhaltung</a>
                <a href="verwaltung.html" class="app-nav-link">Verwaltung</a>
                <a href="admin.html" class="app-nav-link active" aria-current="page">Log</a>
            </nav>
            <button type="button" class="btn btn-ghost danger" onclick="logout()">Abmelden</button>
        </div>
    </header>

    <div class="card admin-controls">
        <div class="filter-row">
            <span class="filter-label">Bereich:</span>
            <button class="filter-btn active" data-filter="all">Alle</button>
            <button class="filter-btn" data-filter="buchungen">Journal</button>
            <button class="filter-btn" data-filter="debitoren">Debitoren</button>
            <button class="filter-btn" data-filter="kunden_adressen">Kunden</button>
            <button class="filter-btn" data-filter="ferienwohnung_buchungen">Ferienwohnung</button>
            <button class="filter-btn" data-filter="verkaeufe_events">Events</button>
            <button class="filter-btn" data-filter="eroeffnungsbilanz">Eröffnungsbilanz</button>
        </div>
        <div class="filter-row">
            <span class="filter-label">Zeitraum:</span>
            <input type="date" id="dateVon" class="date-input" aria-label="Von">
            <span>bis</span>
            <input type="date" id="dateBis" class="date-input" aria-label="Bis">
            <button class="btn-small" onclick="window.resetDates()">Datum zurücksetzen</button>
            <button class="btn-small" onclick="window.refreshLogs()" title="Die Liste aktualisiert sich automatisch. Neu verbinden, falls etwas hängt.">🔄 Neu laden</button>
        </div>
    </div>

    <div class="card">
        <div class="table-container">
        <table>
            <thead>
                <tr>
                    <th style="width: 160px;">Datum / Zeit</th>
                    <th style="width: 140px;">Bereich</th>
                    <th style="width: 100px;">Aktion</th>
                    <th>Kurz-Info (Klick für Details)</th>
                    <th class="right" style="width: 150px;"></th>
                </tr>
            </thead>
            <tbody id="logBody">
                <tr><td colspan="5" class="center muted" style="padding: 40px;">Lade Logs…</td></tr>
            </tbody>
        </table>
        </div>
    </div>

<script type="module">
    import { auth, onAuthStateChanged, signOut } from "./js/firebase.js";
    import { escapeHtml } from "./js/utils.js";
    import { toast, bestaetigen } from "./js/ui.js";
    import { db, collection, query, orderBy, limit, onSnapshot, doc, getDoc, setDoc, deleteDoc, where, Timestamp } from "./js/firestore.js";

    let currentFilter = "all";
    // Live-Verbindung statt Neuladen jede Minute: Firestore berechnet nach dem ersten
    // Laden nur noch neue Log-Einträge (vorher bis zu 100 Lesevorgänge pro Minute).
    let unsubscribeLogs = null;
    const offeneZeilen = new Set();

    window.logout = () => signOut(auth);

    onAuthStateChanged(auth, (user) => {
        if (!user) window.location.href = "index.html";
        else initApp();
    });

    function initApp() {
        document.querySelectorAll('.filter-btn[data-filter]').forEach(btn => {
            btn.onclick = (e) => {
                document.querySelectorAll('.filter-btn[data-filter]').forEach(b => b.classList.remove('active'));
                e.target.classList.add('active');
                currentFilter = e.target.getAttribute('data-filter');
                abonniereLogs();
            };
        });

        document.getElementById('dateVon').onchange = abonniereLogs;
        document.getElementById('dateBis').onchange = abonniereLogs;

        window.resetDates = () => {
            document.getElementById('dateVon').value = '';
            document.getElementById('dateBis').value = '';
            abonniereLogs();
        };

        window.refreshLogs = () => abonniereLogs();

        abonniereLogs();
    }

    function buildLogsQuery() {
        const von = document.getElementById('dateVon').value;
        const bis = document.getElementById('dateBis').value;

        let conditions = [orderBy("timestamp", "desc"), limit(100)];
        
        if (currentFilter !== "all") {
            conditions.unshift(where("collection", "==", currentFilter));
        }
        
        if (von) {
            conditions.unshift(where("timestamp", ">=", Timestamp.fromDate(new Date(von))));
        }
        if (bis) {
            const endOfDay = new Date(bis);
            endOfDay.setHours(23, 59, 59, 999);
            conditions.unshift(where("timestamp", "<=", Timestamp.fromDate(endOfDay)));
        }

        return query(collection(db, "audit_logs"), ...conditions);
    }

    function abonniereLogs() {
        if (unsubscribeLogs) unsubscribeLogs();
        const tbody = document.getElementById('logBody');
        tbody.innerHTML = '<tr><td colspan="5" class="center muted" style="padding: 40px;">Lade Logs...</td></tr>';
        unsubscribeLogs = onSnapshot(buildLogsQuery(), renderTable, (error) => {
            console.error("Firestore Error:", error);
            if (String(error.message || '').includes("index")) {
                tbody.innerHTML = '<tr><td colspan="5" class="center" style="padding: 40px; color: var(--danger);">Für diesen Filter fehlt ein Index in der Firebase Console. Der Link dazu steht in der Browser-Konsole (F12).</td></tr>';
            } else {
                tbody.innerHTML = '<tr><td colspan="5" class="center" style="padding: 40px; color: var(--danger);">Fehler beim Laden der Logs.</td></tr>';
            }
        });
    }

    function formatVal(key, val) {
        if(val === null || val === undefined) return '-';
        if(key.includes('rappen') || key === 'betrag') return `CHF ${(val/100).toFixed(2)}`;
        if(key === 'online' && Array.isArray(val)) return val.join(', ');
        if(key.includes('datum') || key === 'erstellt_am' || key === 'aktualisiert_am') {
            if(val.seconds) return new Date(val.seconds*1000).toLocaleString('de-CH');
            return val;
        }
        if(typeof val === 'boolean') return val ? 'Ja' : 'Nein';
        if(typeof val === 'object') return JSON.stringify(val); // Für Produkte-Arrays
        return val;
    }

    // Erstellt eine schöne HTML-Tabelle aus einem Objekt
    function renderDataBox(title, dataObj, color) {
        if(!dataObj) return `<div class="data-box" style="border-top-color: #cbd5e1;"><h4>${title}</h4><i>Keine Daten</i></div>`;
        
        let html = `<div class="data-box" style="border-top-color: ${color};">
                        <h4>${title}</h4>
                        <table class="data-table">`;
        
        // Sortiere Keys alphabetisch für bessere Übersicht, aber halte wichtige oben
        let keys = Object.keys(dataObj).sort();
        
        keys.forEach(key => {
            html += `<tr><td>${escapeHtml(key.replace('_', ' '))}</td><td>${escapeHtml(formatVal(key, dataObj[key]))}</td></tr>`;
        });
        
        html += `</table></div>`;
        return html;
    }

    function renderTable(snapshot) {
        const tbody = document.getElementById('logBody');
        tbody.innerHTML = '';
        
        if(snapshot.empty) {
            tbody.innerHTML = '<tr><td colspan="5" class="center muted" style="padding: 40px;">Keine Einträge gefunden.</td></tr>';
            return;
        }

        snapshot.forEach(logDoc => {
            const log = logDoc.data();
            const id = logDoc.id;
            
            const colLabel = {
                'buchungen': 'Journal', 'debitoren': 'Debitor', 'kunden_adressen': 'Kunde',
                'ferienwohnung_buchungen': 'FW', 'verkaeufe_events': 'Event', 'eroeffnungsbilanz': 'EB'
            }[log.collection] || log.collection;

            const time = log.timestamp?.toDate().toLocaleString('de-CH') || '...';
            
            // Kurz-Info Text generieren
            const d = log.after_data || log.before_data || {};
            let shortInfo = `<strong>${escapeHtml(d.text || d.nachname || d.event_name || d.name || d.accountId || 'Dokument')}</strong>`;
            if(d.betrag || d.betrag_rappen) shortInfo += ` (CHF ${((d.betrag || d.betrag_rappen)/100).toFixed(2)})`;

            // Haupt-Zeile erstellen
            const trMain = document.createElement('tr');
            trMain.className = 'main-row';
            trMain.onclick = () => window.toggleRow(id);
            trMain.innerHTML = `
                <td>${time}</td>
                <td><span class="badge col-${getShortCol(log.collection)}">${colLabel}</span></td>
                <td><span class="badge act-${log.action.toLowerCase()}">${log.action}</span></td>
                <td style="font-size:0.95em;">${shortInfo}</td>
                <td class="right"><span class="zeilen-aktionen">
                    <button class="btn-small" onclick="window.doUndo(event, '${id}')" title="Diese Änderung rückgängig machen">↩️ Undo</button>
                    <span class="toggle-icon" aria-hidden="true">▾</span>
                </span></td>
            `;
            
            // Detail-Zeile erstellen
            let diffHtml = '';
            if (log.action === "CREATE") {
                diffHtml = renderDataBox("Neu erstellte Daten", log.after_data, "#27ae60");
            } else if (log.action === "DELETE") {
                diffHtml = renderDataBox("Gelöschte Daten", log.before_data, "#e74c3c");
            } else if (log.action === "UPDATE") {
                diffHtml = `
                    <div class="diff-grid">
                        ${renderDataBox("Vorher (Alter Zustand)", log.before_data, "#e74c3c")}
                        ${renderDataBox("Nachher (Neuer Zustand)", log.after_data, "#27ae60")}
                    </div>`;
            }

            const trDetails = document.createElement('tr');
            trDetails.className = 'details-row';
            trDetails.id = `detail_${id}`;
            trDetails.innerHTML = `
                <td colspan="5" class="details-container">
                    <div class="details-ids">
                        Document ID: ${escapeHtml(log.documentId)} | Log ID: ${escapeHtml(id)}
                    </div>
                    ${diffHtml}
                </td>
            `;

            // Aufgeklappte Einträge bleiben offen, wenn neue Logs eintreffen.
            if (offeneZeilen.has(id)) {
                trMain.classList.add('open');
                trDetails.classList.add('open');
            }

            tbody.appendChild(trMain);
            tbody.appendChild(trDetails);
        });
    }

    window.toggleRow = (id) => {
        const detailRow = document.getElementById(`detail_${id}`);
        const mainRow = detailRow.previousElementSibling;
        
        const offen = detailRow.classList.toggle('open');
        mainRow.classList.toggle('open', offen);
        if (offen) offeneZeilen.add(id); else offeneZeilen.delete(id);
    };

    function getShortCol(c) {
        if(c==='kunden_adressen') return 'adressen';
        if(c==='ferienwohnung_buchungen') return 'fw';
        if(c==='verkaeufe_events') return 'events';
        if(c==='eroeffnungsbilanz') return 'eb';
        return c;
    }

    window.doUndo = async (event, id) => {
        event.stopPropagation(); // Verhindert, dass die Zeile beim Klick auf Undo aufklappt
        
        if(!await bestaetigen({ titel: 'Änderung rückgängig machen?', text: 'Der Datensatz wird auf den Stand vor dieser Änderung zurückgesetzt.', ok: 'Rückgängig machen', gefahr: true })) return;
        
        try {
            const snap = await getDoc(doc(db, "audit_logs", id));
            const log = snap.data();
            const ref = doc(db, log.collection, log.documentId);
            
            if (log.action === "CREATE") {
                await deleteDoc(ref);
            } else {
                await setDoc(ref, log.before_data);
            }
            toast('Änderung rückgängig gemacht.', 'success');
        } catch (e) { 
            console.error(e);
            toast('Fehler beim Rückgängigmachen: ' + e.message, 'error', 6000); 
        }
    };
</script>
</body>
</html>
