<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - CreArt Buchhaltung</title>
    <link rel="stylesheet" href="css/styles.css">
    <style>
        body { display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0 auto; }
        .login-card { background: var(--card-bg); padding: 40px; border-radius: var(--radius-lg); box-shadow: var(--shadow-pop); width: 100%; max-width: 400px; }
        .login-card h1 { margin: 0 0 25px; text-align: center; font-size: 1.6rem; }
        .login-card .form-group { margin-bottom: 18px; }
        .checkbox-group { display: flex; align-items: center; gap: 8px; margin-bottom: 20px; cursor: pointer; font-weight: 400; color: var(--secondary); }
        .checkbox-group input { width: 17px; height: 17px; margin: 0; cursor: pointer; }
        .login-card .btn-main { width: 100%; }
        #errorMessage { color: var(--danger); font-weight: 600; margin-top: 15px; display: none; font-size: var(--fs-sm); text-align: center; }
        @media (max-width: 768px) { .login-card { padding: 24px; } }
    </style>
</head>
<body>

    <div class="login-card" id="loginUI" style="opacity: 0; transition: opacity 0.3s;">
        <h1>CreArt Buchhaltung</h1>
        <div class="form-group">
            <label for="email">E-Mail Adresse</label>
            <input type="email" id="email" placeholder="name@domain.ch" autocomplete="username" required>
        </div>
        <div class="form-group">
            <label for="password">Passwort</label>
            <input type="password" id="password" placeholder="••••••••" autocomplete="current-password" required>
        </div>
        
        <label class="checkbox-group">
            <input type="checkbox" id="rememberMe" checked>
            <span>Auf diesem Gerät angemeldet bleiben</span>
        </label>

        <button id="btnLogin" class="btn-main">Einloggen</button>
        <div id="errorMessage">Zugangsdaten falsch.</div>
    </div>

    <script type="module">
        import { auth, signInWithEmailAndPassword, onAuthStateChanged, setPersistence, browserLocalPersistence, browserSessionPersistence } from "./js/firebase.js";
        

        // --- DER AUTO-REDIRECT ---
        // Prüft sofort beim Laden, ob du schon eingeloggt bist
        onAuthStateChanged(auth, (user) => {
            if (user) {
                // Du bist schon bekannt -> ab zur App!
                window.location.href = "eingabe.html";
            } else {
                // Niemand eingeloggt -> Formular sichtbar machen
                document.getElementById('loginUI').style.opacity = '1';
            }
        });

        // --- DAS LOGIN ---
        document.getElementById('btnLogin').addEventListener('click', () => {
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const rememberMe = document.getElementById('rememberMe').checked;
            const btn = document.getElementById('btnLogin');
            const errorDiv = document.getElementById('errorMessage');

            if(!email || !password) {
                errorDiv.innerText = "Bitte E-Mail und Passwort eingeben.";
                errorDiv.style.display = "block";
                return;
            }

            btn.innerText = "Prüfe Daten...";
            btn.disabled = true;
            errorDiv.style.display = "none";

            // 1. Speichermethode festlegen (Dauerhaft vs. Nur für diese Sitzung)
            const speicherArt = rememberMe ? browserLocalPersistence : browserSessionPersistence;

            setPersistence(auth, speicherArt)
                .then(() => {
                    // 2. Einloggen
                    return signInWithEmailAndPassword(auth, email, password);
                })
                .then(() => {
                    // Erfolg (wird durch onAuthStateChanged oben automatisch weitergeleitet)
                })
                .catch((error) => {
                    btn.innerText = "Einloggen";
                    btn.disabled = false;
                    errorDiv.innerText = "Zugangsdaten ungültig oder Nutzer existiert nicht.";
                    errorDiv.style.display = "block";
                    console.error(error.message);
                });
        });

        document.addEventListener('keypress', function (e) {
            if (e.key === 'Enter') document.getElementById('btnLogin').click();
        });
    </script>
</body>
</html>
